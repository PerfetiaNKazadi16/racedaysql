name: RaceDay Part 1 Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required Part 1 files
        run: |
          test -s README.md
          test -s "SQLQuery5 prog part1.sql"
          test -d docs/docs
          find docs/docs -type f -print -quit | grep -q .

      - name: Check SQL script has database and table creation
        run: |
          grep -Eiq '^[[:space:]]*CREATE[[:space:]]+DATABASE' "SQLQuery5 prog part1.sql"
          grep -Eiq '^[[:space:]]*CREATE[[:space:]]+TABLE' "SQLQuery5 prog part1.sql"
