name: Validate RaceDay Documentation

on:
  push:
  pull_request:

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder
        run: |
          test -d docs
          echo "docs folder exists"

      - name: Check required files
        run: |
          test -f docs/RaceDay_ERD.png
          test -f docs/RaceDay_API_Endpoint_Plan.md
          test -f docs/RaceDay_Database.sql
          echo "All required documentation files exist"

      - name: Validation successful
        run: echo "RaceDay documentation structure is valid"
